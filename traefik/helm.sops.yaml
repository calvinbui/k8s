            from: All
        websecure:
          port: 8443
          protocol: HTTPS
          hostname: ENC[AES256_GCM,data:xPhNSobkl9A=,iv:IpHWmysuniadDqXsuBQJxJyWPS+rCJGVuPvMRHir3GY=,tag:XCJZLtmsCsJhyuQgAPFY7A==,type:str]
