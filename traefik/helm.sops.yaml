apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 5s
  chartRef:
    kind: OCIRepository
    name: traefik
  values:
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    deployment:
      replicas: 1
    ingressRoute:
      dashboard:
        enabled: true
    providers:
      kubernetesGateway:
        enabled: true
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      websecure:
        http3:
          enabled: false
    logs:
      access:
        enabled: true
    gateway:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      listeners:
        web:
          hostname: ENC[AES256_GCM,data:le92wArZiSw=,iv:JOPs66C42LnLPkQVgSck8HsiW/fjNYRDxsVY1jNN+O0=,tag:TX8heXzTfTBIY7Qp6q7uhA==,type:str]
