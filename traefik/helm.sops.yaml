apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 5s
  chartRef:
    kind: OCIRepository
    name: traefik
  values:
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    ingressRoute:
      dashboard:
        enabled: true
    providers:
      kubernetesGateway:
        enabled: true
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      websecure:
        http3:
          enabled: true
          advertisedPort: 443
    gateway:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      listeners:
        web:
          hostname: ENC[AES256_GCM,data:ys0H6auerSY=,iv:vS3KLhFvF7Y5b9fy1rTxcvKwQP8mMA5zJtW6cX7nsrE=,tag:RlKAimhY4ZybrYEd9UniXQ==,type:str]
