apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 5s
  chartRef:
    kind: OCIRepository
    name: traefik
  values:
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    deployment:
      replicas: 1
    ingressRoute:
      dashboard:
        enabled: true
    providers:
      kubernetesGateway:
        enabled: true
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      websecure:
        http3:
          enabled: false
    logs:
      access:
        enabled: true
    gateway:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      listeners:
