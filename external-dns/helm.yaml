---

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-dns
spec:
  interval: 5m
  url: https://kubernetes-sigs.github.io/external-dns/

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  interval: 5s
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: external-dns
      chart: external-dns
      version: 1.19.0
  values:
    policy: upsert-only

    provider:
      name: cloudflare

    sources:
      - service
      - ingress
      - gateway-httproute

    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-cloudflare-token
            key: apiToken

    extraArgs:
      - --exclude-target-net=10.0.0.0/8
      - --exclude-target-net=172.16.0.0/12
      - --exclude-target-net=192.168.0.0/16
