---

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cnpg
spec:
  interval: 24h
  url: https://cloudnative-pg.github.io/charts

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
spec:
  interval: 5s
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: cnpg
      chart: cloudnative-pg
      version: 0.26.0
