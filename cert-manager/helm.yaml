---

apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
spec:
  interval: 5m
  url: oci://quay.io/jetstack/charts/cert-manager
  ref:
    tag: v1.18.2
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 5s
  chartRef:
    kind: OCIRepository
    name: cert-manager
  values:
    crds:
      enabled: true

    prometheus:
      enabled: false

    config:
      enableGatewayAPI: true
